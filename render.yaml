services:
  - type: web
    name: trackit-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 740194235229-9lap5diqbta3samct67v4o9baoufct7k.apps.googleusercontent.com
      - key: TRACKIT_WEB_URL
        value: https://trackit-system-3fcdd.web.app
      - key: RENDER_EXTERNAL_URL
        value: https://trackit-backend-s6t6.onrender.com
      # Set these manually in the Render dashboard:
      # FIREBASE_SERVICE_ACCOUNT_JSON  â€” paste the full serviceAccountKey JSON as one line
      # TRACKIT_EMAIL_FROM             â€” your Gmail address
      # TRACKIT_EMAIL_PASSWORD         â€” your Gmail App Password
